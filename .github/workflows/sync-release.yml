name: Sync Release from AppGuard

on:
  repository_dispatch:
    types: [appguard-released]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to sync (e.g. 0.4.1)"
        required: true
      notes:
        description: "Release notes (markdown)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "VERSION=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update script
        run: node scripts/update-release.mjs "${{ steps.vars.outputs.VERSION }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/site.ts
          git diff --staged --quiet || git commit -m "chore: sync release v${{ steps.vars.outputs.VERSION }}"
          git push
